services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: csbot
      POSTGRES_PASSWORD: csbot
      POSTGRES_DB: csbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csbot -d csbot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
